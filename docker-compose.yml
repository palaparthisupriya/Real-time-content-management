version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: redis-cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - cache-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caching-service-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - REDIS_URL=redis://redis:6379/0
      - L1_CAPACITY=100
      - L2_TTL_SECONDS=30
      - LOCK_TIMEOUT_MS=5000
      - LOCK_RETRY_INTERVAL_MS=100
      - LOCK_MAX_RETRIES=50
      - ORACLE_DELAY_SECONDS=2.0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cache-net

networks:
  cache-net:
    driver: bridge

volumes:
  redis_data:
